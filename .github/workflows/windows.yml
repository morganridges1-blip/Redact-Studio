name: Windows validation and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test application
        run: python -m pytest -q --junitxml=test-results.xml
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Publish test summary
        if: always()
        run: python packaging/test_summary.py
      - name: Package Windows executable
        run: python -m PyInstaller --clean --noconfirm packaging/redact_studio.spec
      - name: Frozen application self-test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $result = Start-Process -FilePath '.\dist\RedactStudio\RedactStudio.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw 'Frozen application self-test failed' }
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: RedactStudio-Windows
          path: dist/RedactStudio/
          if-no-files-found: error
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-test-results
          path: test-results.xml
          if-no-files-found: ignore
